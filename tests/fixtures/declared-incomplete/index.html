<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Declared but incomplete</title>
<style>
  body { background: #ffffff; color: #1a1a1a; font: 16px/1.5 system-ui; margin: 0; }

  <img src="img/product.jpg" alt="Red ball" width="150"></div>

</div>
