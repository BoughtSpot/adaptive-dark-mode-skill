<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Declared, but dark styles only apply via a .dark class</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; }
  .dark { --bg: #0f1115; --fg: #e7e9ee; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui; margin: 0; padding: 16px; }
</style></head>
<body>
<p>With a dark OS and no <code>.dark</code> class yet, the UA goes dark but these tokens stay light.</p>
<input placeholder="Email">
<script>/* toggle wired later, e.g. on click */ function toggle(){ document.documentElement.classList.toggle('dark'); }</script>
</body></html>
