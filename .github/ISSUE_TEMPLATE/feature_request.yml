name: Feature or framework request
description: A new check, a new framework section, or a workflow improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve?, description: "What goes wrong in Safari's Adaptive Dark Mode (or your own dark theme) today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: "For a framework, include its version and how it switches themes." }
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR with a fixture and test
